version: 2
project_name: tincan
builds:
  - main: ./cmd/tincan
    binary: tincan
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.Version={{.Version}}
archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/*
      - docs/adapters/*
checksum:
  name_template: checksums.txt
release:
  draft: true
